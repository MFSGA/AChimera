[workspace]

members = [
    "chimera-ffi",
    "uniffi-bindgen",
]
resolver = "2"

[workspace.package]
version = "0.5.0"
edition = "2024"

[workspace.dependencies]
uniffi = { version = "0.31", features = ["tokio"] }
async-compat = "0.2.5"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "unwind"
strip = true

[profile.detailed-release]
inherits = "release"
opt-level = 1
lto = "thin"

strip = "none"
debug = "line-tables-only"
split-debuginfo = "off"
panic = "unwind"

incremental = true
codegen-units = 256

[profile.dev]
opt-level = 1
panic = "unwind"
strip = "debuginfo"

[profile.dev.package.backtrace]
opt-level = 3

[patch.crates-io]
async-compat = { git = "https://github.com/element-hq/async-compat", rev = "5a27c8b290f1f1dcfc0c4ec22c464e38528aa591" }
rustls = { git = "https://github.com/Watfaq/rustls.git", rev = "e6e8e7e1a0d65f2f273eb7b5b6179896536ac174" }
tokio-rustls = { git = "https://github.com/Watfaq/tokio-rustls.git", rev = "b26e3e2b7a0161d505fd12d6e545b16463f1a45f" }
