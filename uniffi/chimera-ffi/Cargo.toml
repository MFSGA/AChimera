[package]
name = "chimera-ffi"
version.workspace = true
edition.workspace = true

[lib]
name = "chimera_ffi"
crate-type = ["cdylib"]

[features]
default = ["mimalloc"]
ffi-trace = ["uniffi/ffi-trace"]
jemallocator = ["dep:tikv-jemallocator"]
mimalloc = ["dep:mimalloc"]

[dependencies]
uniffi.workspace = true
jni = "0.22"
tokio = "1"
async-compat.workspace = true
ipnet = "2"
eyre = "0.6"
bytes = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
urlencoding = "2"
http-body-util = "0.1"
hyper = { version = "1", features = ["client", "http1"] }
hyper-util = { version = "0.1", features = ["client", "client-legacy", "tokio"] }
rustls = { version = "0.23", default-features = false, features = ["std", "aws-lc-rs"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream"] }
tokio-stream = "0.1"
# Logging
tracing = "0.1"
tracing-error = "0.2"
time = { version = "0.3", features = ["macros", "local-offset"] }
tracing-subscriber = { version = "0.3", default-features = false, features = ["std", "fmt"]}
paranoid-android = "0.2"
color-eyre = "0.6"
tikv-jemallocator = { version = "0.6", optional = true }
mimalloc = { version = "0.1", default-features = false, optional = true }

[dependencies.clash-lib]
package = "clash-lib"
rev = "523e40e461961ac7cfb6b4ebe098d4c5a67eed47"
git = "https://github.com/MFSGA/Chimera_Client.git"
# Keep the Android runtime feature surface explicit so upstream default changes
# cannot silently add or remove protocols and listeners.
features = [
    "zero_copy",
    "tls",
    "aws-lc-rs",
    "tun",
    "port",
    "reality",
    "extended-health-check",
    "ws",
    "trojan",
    "hysteria",
    "tracing",
]
default-features = false

[target.'cfg(unix)'.dependencies]
hyperlocal = "0.9"

[build-dependencies]
uniffi = { workspace = true, features = ["build"] }
