mixed-port: 7890
proxies:
  - name: trojan-ws-tls
    type: trojan
    server: 127.0.0.1
    port: 443
    password: test-password
    network: ws
    sni: example.com
    skip-cert-verify: true
    ws-opts:
      path: /websocket
      headers:
        Host: example.com
proxy-groups:
  - name: PROXY
    type: select
    proxies:
      - trojan-ws-tls
rules:
  - MATCH,PROXY
