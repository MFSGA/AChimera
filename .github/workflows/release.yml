name: Release Package

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      bump_type:
        description: "Version bump type (major/minor/patch)"
        required: true
        type: choice
        default: "patch"
        options:
          - major
          - minor
          - patch
      tag_name:
        description: "Optional explicit tag name (e.g. v0.2.0). Overrides bump_type if provided."
        required: false
        type: string

defaults:
  run:
    shell: bash

permissions:
  contents: read

env:
  RUST_TOOLCHAIN: "1.97.1"
  RUSTC_BOOTSTRAP: "1"
  ANDROID_PLATFORM_VERSION: "36"
  ANDROID_BUILD_TOOLS_VERSION: "36.0.0"
  ANDROID_NDK_VERSION: "29.0.14206865"

concurrency:
  group: ${{ github.workflow }}-${{ inputs.tag_name || github.ref_name }}
  cancel-in-progress: false

jobs:
  bump:
    name: Bump version and push tag
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      tag: ${{ steps.resolve.outputs.tag }}

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: "temurin"
          java-version: "25"

      - name: Validate signing secrets before version bump
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          umask 077
          MISSING=()
          for name in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!name:-}" ]; then
              MISSING+=("$name")
            fi
          done
          if [ "${#MISSING[@]}" -ne 0 ]; then
            echo "ERROR: required release signing secrets are missing: ${MISSING[*]}" >&2
            echo "No version commit or tag was created." >&2
            exit 1
          fi

          KEYSTORE_FILE="${RUNNER_TEMP}/chimera-release-preflight-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.jks"
          PROBE_INPUT="${RUNNER_TEMP}/chimera-signing-probe-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.txt"
          PROBE_JAR="${RUNNER_TEMP}/chimera-signing-probe-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.jar"
          SIGNED_PROBE_JAR="${RUNNER_TEMP}/chimera-signing-probe-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-signed.jar"
          trap 'rm -f "$KEYSTORE_FILE" "$PROBE_INPUT" "$PROBE_JAR" "$SIGNED_PROBE_JAR"' EXIT
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_FILE"
          chmod 600 "$KEYSTORE_FILE"
          if [ ! -s "$KEYSTORE_FILE" ] || ! keytool -list -keystore "$KEYSTORE_FILE" \
            -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" >/dev/null 2>&1; then
            echo "ERROR: release keystore, password, or key alias is invalid." >&2
            echo "No version commit or tag was created." >&2
            exit 1
          fi

          EXPECTED_FINGERPRINT="$(tr -d '[:space:]' < SIGNING_CERT_SHA256.txt | tr '[:upper:]' '[:lower:]')"
          if [[ ! "$EXPECTED_FINGERPRINT" =~ ^[[:xdigit:]]{64}$ ]]; then
            echo "ERROR: SIGNING_CERT_SHA256.txt must contain one SHA-256 certificate fingerprint." >&2
            echo "No version commit or tag was created." >&2
            exit 1
          fi
          ACTUAL_FINGERPRINT="$(keytool -exportcert -keystore "$KEYSTORE_FILE" \
            -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" | sha256sum | awk '{print $1}')"
          if [ "$ACTUAL_FINGERPRINT" != "$EXPECTED_FINGERPRINT" ]; then
            echo "ERROR: release keystore certificate does not match SIGNING_CERT_SHA256.txt." >&2
            echo "No version commit or tag was created." >&2
            exit 1
          fi

          printf 'AChimera release signing preflight\n' > "$PROBE_INPUT"
          jar --create --file "$PROBE_JAR" -C "$RUNNER_TEMP" "$(basename "$PROBE_INPUT")"
          if ! jarsigner -keystore "$KEYSTORE_FILE" \
            -storepass "$KEYSTORE_PASSWORD" -keypass "$KEY_PASSWORD" \
            -signedjar "$SIGNED_PROBE_JAR" "$PROBE_JAR" "$KEY_ALIAS" >/dev/null 2>&1; then
            echo "ERROR: release key password or alias cannot sign a test artifact." >&2
            echo "No version commit or tag was created." >&2
            exit 1
          fi
          echo "Release keystore, certificate fingerprint, and signing credentials passed preflight before version/tag writes."

      - name: Resolve next version
        id: resolve
        env:
          EXPLICIT_TAG: ${{ inputs.tag_name }}
          BUMP_TYPE: ${{ inputs.bump_type }}
        run: |
          set -euo pipefail

          # Read current version from app/build.gradle.kts
          CURRENT=$(grep -oE 'baseVersionName = "[0-9]+\.[0-9]+\.[0-9]+"' app/build.gradle.kts \
            | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' | head -n 1)
          if [ -z "$CURRENT" ]; then
            echo "ERROR: Could not parse current version from app/build.gradle.kts" >&2
            exit 1
          fi
          echo "Current version: $CURRENT"

          if [ -n "$EXPLICIT_TAG" ]; then
            # Validate explicit tag format
            if [[ ! "$EXPLICIT_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] ||
              [[ "$EXPLICIT_TAG" == *$'\n'* || "$EXPLICIT_TAG" == *$'\r'* ]]; then
              echo "ERROR: explicit tag must match vX.Y.Z, got: $EXPLICIT_TAG" >&2
              exit 1
            fi
            NEW_VERSION="${EXPLICIT_TAG#v}"
            echo "Using explicit tag: $EXPLICIT_TAG"
          else
            IFS='.' read -r MAJOR MINOR PATCH <<< "$CURRENT"
            case "$BUMP_TYPE" in
              major)
                MAJOR=$((MAJOR + 1))
                MINOR=0
                PATCH=0
                ;;
              minor)
                MINOR=$((MINOR + 1))
                PATCH=0
                ;;
              patch)
                PATCH=$((PATCH + 1))
                ;;
              *)
                echo "ERROR: Unknown bump_type: $BUMP_TYPE" >&2
                exit 1
                ;;
            esac
            NEW_VERSION="$MAJOR.$MINOR.$PATCH"
          fi

          TAG="v$NEW_VERSION"

          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "ERROR: tag $TAG already exists locally" >&2
            exit 1
          fi

          echo "version=$NEW_VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Resolved next version: $NEW_VERSION (tag: $TAG)"

      - name: Update version in source files
        env:
          NEW_VERSION: ${{ steps.resolve.outputs.version }}
        run: |
          set -euo pipefail
          NEW_VERSION="$NEW_VERSION"

          # Update app/build.gradle.kts
          if [ -f app/build.gradle.kts ]; then
            sed -i -E "s/(baseVersionName = \")[0-9]+\.[0-9]+\.[0-9]+(\")/\1${NEW_VERSION}\2/" app/build.gradle.kts
            echo "Updated app/build.gradle.kts:"
            grep -E 'baseVersionName' app/build.gradle.kts
          fi

          # Update uniffi/Cargo.toml workspace version
          if [ -f uniffi/Cargo.toml ]; then
            sed -i -E "0,/^(version = \")[0-9]+\.[0-9]+\.[0-9]+(\")/{s//\1${NEW_VERSION}\2/}" uniffi/Cargo.toml
            cargo update --manifest-path uniffi/Cargo.toml -p chimera-ffi
            echo "Updated uniffi/Cargo.toml:"
            grep -E '^version' uniffi/Cargo.toml | head -n 3
          fi

          echo "----- diff -----"
          git --no-pager diff -- app/build.gradle.kts uniffi/Cargo.toml uniffi/Cargo.lock || true

      - name: Create commit and tag
        env:
          NEW_TAG: ${{ steps.resolve.outputs.tag }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git diff --quiet -- app/build.gradle.kts uniffi/Cargo.toml uniffi/Cargo.lock; then
            echo "Version files already match ${NEW_TAG}; skipping commit"
          else
            git add app/build.gradle.kts uniffi/Cargo.toml uniffi/Cargo.lock
            git commit -m "chore(release): bump version to ${NEW_TAG}"
          fi

          git tag -a "${NEW_TAG}" -m "Release ${NEW_TAG}"

          echo "Pushing commit and tag ${NEW_TAG}..."
          git push origin HEAD:main
          git push origin "${NEW_TAG}"

      - name: Summary
        env:
          BUMP_TYPE: ${{ inputs.bump_type }}
          NEW_VERSION: ${{ steps.resolve.outputs.version }}
          NEW_TAG: ${{ steps.resolve.outputs.tag }}
        run: |
          echo "### Version bumped ✅" >> "$GITHUB_STEP_SUMMARY"
          echo "- Bump type: \`${BUMP_TYPE}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- New version: \`${NEW_VERSION}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- New tag: \`${NEW_TAG}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "Release job will build and publish artifacts for the created tag in this workflow." >> "$GITHUB_STEP_SUMMARY"

  release:
    name: Build and publish release
    needs: [bump]
    if: |
      always() &&
      (
        (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) ||
        (github.event_name == 'workflow_dispatch' && needs.bump.result == 'success')
      )
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Resolve release tag
        id: version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          BUMPED_TAG: ${{ needs.bump.outputs.tag }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            TAG_NAME="$RELEASE_TAG"
          else
            # workflow_dispatch: use the tag created by the bump job
            TAG_NAME="$BUMPED_TAG"
          fi

          if [[ -z "$TAG_NAME" ]]; then
            echo "ERROR: could not resolve release tag" >&2
            exit 1
          fi
          if [[ ! "$TAG_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] ||
            [[ "$TAG_NAME" == *$'\n'* || "$TAG_NAME" == *$'\r'* ]]; then
            echo "ERROR: release tag must match vX.Y.Z, got: $TAG_NAME" >&2
            exit 1
          fi
          echo "tag=$TAG_NAME" >> "$GITHUB_OUTPUT"
          echo "Resolved release tag: $TAG_NAME"

      - name: Checkout code at tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          ref: refs/tags/${{ steps.version.outputs.tag }}

      - name: Verify release source is on main and matches the tag
        env:
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin main

          RELEASE_COMMIT="$(git rev-parse "${RELEASE_TAG}^{commit}")"
          MAIN_COMMIT="$(git rev-parse FETCH_HEAD)"
          if ! git merge-base --is-ancestor "$RELEASE_COMMIT" "$MAIN_COMMIT"; then
            echo "Release tag $RELEASE_TAG does not point to a commit contained in main." >&2
            exit 1
          fi

          TAG_VERSION="${RELEASE_TAG#v}"
          SOURCE_VERSION="$(sed -nE 's/^val baseVersionName = "([^"]+)"$/\1/p' app/build.gradle.kts | head -n 1)"
          if [ -z "$SOURCE_VERSION" ] || [ "$SOURCE_VERSION" != "$TAG_VERSION" ]; then
            echo "Release tag $RELEASE_TAG does not match app base version ${SOURCE_VERSION:-<missing>}." >&2
            exit 1
          fi

          echo "Release tag points to reviewed main history and matches app version $SOURCE_VERSION."

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: "temurin"
          java-version: "25"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1 (current master)
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: "x86_64-unknown-linux-gnu"
          components: "rustfmt,clippy,rust-src"

      - name: Add Rust Android targets
        run: |
          rustup target add aarch64-linux-android
          rustup target add armv7-linux-androideabi
          rustup target add i686-linux-android
          rustup target add x86_64-linux-android

      - name: Setup sccache
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11

      - name: Install cargo-ndk and just
        uses: taiki-e/install-action@1168f6810a3cb30a3514bf5756a3b7f0422c6df8 # v2
        with:
          tool: cargo-ndk,just

      - name: Configure SCCache & AWS-LC-RS
        run: |
          echo "SCCACHE_GHA_ENABLED=true" >> "$GITHUB_ENV"
          echo "RUSTC_WRAPPER=sccache" >> "$GITHUB_ENV"
          echo "AWS_LC_SYS_PREBUILT_NASM=1" >> "$GITHUB_ENV"

      - name: Cache Gradle dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties', '**/libs.versions.toml') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Configure Android SDK
        run: |
          set -euo pipefail
          if [ -z "${ANDROID_HOME:-}" ]; then
            echo "ANDROID_HOME is not set on runner."
            exit 1
          fi
          sdkmanager_path="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$sdkmanager_path" ]; then
            sdkmanager_path="$(find "${ANDROID_HOME}/cmdline-tools" -path '*/bin/sdkmanager' -type f -print -quit)"
          fi
          if [ -z "$sdkmanager_path" ] || [ ! -x "$sdkmanager_path" ]; then
            echo "sdkmanager was not found under ANDROID_HOME=${ANDROID_HOME}."
            exit 1
          fi
          "$sdkmanager_path" \
            "platforms;android-${ANDROID_PLATFORM_VERSION}" \
            "build-tools;${ANDROID_BUILD_TOOLS_VERSION}" \
            "ndk;${ANDROID_NDK_VERSION}"
          echo "ANDROID_NDK_HOME=${ANDROID_HOME}/ndk/${ANDROID_NDK_VERSION}" >> "$GITHUB_ENV"
          echo "sdk.dir=${ANDROID_HOME}" > local.properties

      - name: Validate signing secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          MISSING=()
          for name in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!name:-}" ]; then
              MISSING+=("$name")
            fi
          done
          if [ "${#MISSING[@]}" -ne 0 ]; then
            echo "ERROR: required release signing secrets are missing: ${MISSING[*]}" >&2
            echo "Configure them in Settings → Secrets and variables → Actions." >&2
            exit 1
          fi
          echo "All required release signing secrets are present."

      - name: Run quality checks
        run: ./gradlew testDebugUnitTest lintDebug

      - name: Decode and validate keystore
        id: keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          set -euo pipefail
          umask 077
          KEYSTORE_FILE="${RUNNER_TEMP}/chimera-release-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.jks"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_FILE"
          chmod 600 "$KEYSTORE_FILE"
          if [ ! -s "$KEYSTORE_FILE" ]; then
            echo "Decoded release keystore is empty." >&2
            exit 1
          fi
          keytool -list -keystore "$KEYSTORE_FILE" \
            -storepass "$KEYSTORE_PASSWORD" \
            -alias "$KEY_ALIAS" >/dev/null 2>&1
          echo "path=$KEYSTORE_FILE" >> "$GITHUB_OUTPUT"

      - name: Build release APKs
        env:
          KEYSTORE_FILE: ${{ steps.keystore.outputs.path }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          ANDROID_SPLIT_ABI_ENABLE: "true"
          ANDROID_SPLIT_ABI_UNIVERSAL_APK: "true"
        run: |
          set -euo pipefail
          rm -rf app/build/outputs/apk
          echo "Building release APKs with the configured release keystore..."
          ./gradlew assembleRelease

      - name: Verify signed APK signatures
        run: |
          set -euo pipefail
          APKSIGNER="${ANDROID_HOME}/build-tools/${ANDROID_BUILD_TOOLS_VERSION}/apksigner"
          if [ ! -x "$APKSIGNER" ]; then
            echo "apksigner not found: $APKSIGNER" >&2
            exit 1
          fi
          mapfile -t APK_PATHS < <(find app/build/outputs/apk/release -type f -name "*.apk" | sort)
          if [ "${#APK_PATHS[@]}" -eq 0 ]; then
            echo "No signed release APK found." >&2
            exit 1
          fi
          EXPECTED_FINGERPRINT="$(tr -d '[:space:]' < SIGNING_CERT_SHA256.txt | tr '[:upper:]' '[:lower:]')"
          if [[ ! "$EXPECTED_FINGERPRINT" =~ ^[[:xdigit:]]{64}$ ]]; then
            echo "SIGNING_CERT_SHA256.txt must contain one SHA-256 certificate fingerprint." >&2
            exit 1
          fi
          SIGNING_FINGERPRINT=""
          for APK_PATH in "${APK_PATHS[@]}"; do
            echo "Verifying APK signature: $APK_PATH"
            VERIFY_OUTPUT="$("$APKSIGNER" verify --verbose --print-certs "$APK_PATH" 2>&1)"
            printf '%s\n' "$VERIFY_OUTPUT"
            SIGNER_COUNT="$(printf '%s\n' "$VERIFY_OUTPUT" | awk -F': ' '/^Number of signers:/ { print $2 }')"
            if [ "$SIGNER_COUNT" != "1" ]; then
              echo "Expected exactly one APK signer, found: ${SIGNER_COUNT:-none}." >&2
              exit 1
            fi
            APK_FINGERPRINT="$(printf '%s\n' "$VERIFY_OUTPUT" | awk -F': ' '/Signer #1 certificate SHA-256 digest:/ { print tolower($2) }')"
            if [ "$APK_FINGERPRINT" != "$EXPECTED_FINGERPRINT" ]; then
              echo "APK signer fingerprint does not match SIGNING_CERT_SHA256.txt: $APK_PATH" >&2
              exit 1
            fi
            if [ -n "$SIGNING_FINGERPRINT" ] && [ "$APK_FINGERPRINT" != "$SIGNING_FINGERPRINT" ]; then
              echo "Release APKs were signed by different certificates." >&2
              exit 1
            fi
            SIGNING_FINGERPRINT="$APK_FINGERPRINT"
          done
          mkdir -p output
          printf '%s\n' "$SIGNING_FINGERPRINT" > output/SIGNING_CERT_SHA256.txt

      - name: Remove temporary keystore
        if: always()
        run: rm -f "${RUNNER_TEMP}/chimera-release-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.jks"

      - name: Generate dependency inventory
        run: |
          set -euo pipefail
          mkdir -p output
          ./gradlew -q app:dependencies --configuration releaseRuntimeClasspath \
            > output/DEPENDENCIES-android-release-runtime.txt
          cargo metadata --manifest-path uniffi/Cargo.toml --locked --format-version 1 \
            > output/DEPENDENCIES-rust-cargo-metadata.json

      - name: Organize release artifacts
        env:
          VERSION: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          mkdir -p output
          mapfile -t APK_PATHS < <(find app/build/outputs/apk/release -name "*.apk" | sort)
          if [ "${#APK_PATHS[@]}" -eq 0 ]; then
            echo "No release APK found."
            exit 1
          fi
          for APK_PATH in "${APK_PATHS[@]}"; do
            APK_NAME=$(basename "$APK_PATH")
            APK_BASE="${APK_NAME#app-}"
            APK_BASE="${APK_BASE%.apk}"
            APK_BASE="${APK_BASE%-release}"
            cp "$APK_PATH" "output/chimera-lite-${VERSION}-${APK_BASE}.apk"
          done
          sha256sum output/*.apk output/DEPENDENCIES-* output/SIGNING_CERT_SHA256.txt > output/SHA256SUMS.txt
          ls -lh output/
          echo "All release APK artifacts passed apksigner verification."

      - name: Upload release package artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: app-release-package-${{ steps.version.outputs.tag }}
          path: output/*
          if-no-files-found: error
          retention-days: 30

      - name: Determine commit range for changelog
        id: commit-range
        env:
          CURRENT_TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          CURRENT_COMMIT=$(git rev-list -n 1 "$CURRENT_TAG")
          PREVIOUS_TAG=$(git describe --tags --match "v*" --abbrev=0 "${CURRENT_COMMIT}^" 2>/dev/null || true)
          if [ -z "$PREVIOUS_TAG" ]; then
            echo "args=$CURRENT_TAG" >> "$GITHUB_OUTPUT"
          else
            echo "args=$PREVIOUS_TAG..$CURRENT_TAG" >> "$GITHUB_OUTPUT"
          fi

      - name: Generate changelog
        uses: orhun/git-cliff-action@a9a95522b26fe6403f7bb24031f21fb573d0f5ff # current main
        with:
          config: .github/cliff.toml
          args: ${{ steps.commit-range.outputs.args }} --strip header
        env:
          GITHUB_REPO: ${{ github.repository }}
          OUTPUT: CHANGELOG.md

      - name: Publish GitHub release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          gh release delete "$TAG_NAME" --yes || true
          gh release create "$TAG_NAME" output/* --title "$TAG_NAME" --notes-file CHANGELOG.md --latest
