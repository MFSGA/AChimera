name: CI Build

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

defaults:
  run:
    shell: bash

permissions:
  contents: read

env:
  RUST_TOOLCHAIN: "1.97.1"
  RUSTC_BOOTSTRAP: "1"
  ANDROID_PLATFORM_VERSION: "36"
  ANDROID_BUILD_TOOLS_VERSION: "36.0.0"
  ANDROID_NDK_VERSION: "29.0.14206865"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # Pin the known-compatible image: cargo-ndk requires GLIBC_2.39 and Android CI needs KVM.
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Verify GitHub Action pins
        run: python3 .github/check_action_pins.py

      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: "temurin"
          java-version: "25"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1 (current master)
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: "x86_64-unknown-linux-gnu"
          components: "rustfmt,clippy,rust-src"

      - name: Add Rust Android targets
        run: |
          rustup target add aarch64-linux-android
          rustup target add armv7-linux-androideabi
          rustup target add i686-linux-android
          rustup target add x86_64-linux-android

      - name: Setup sccache
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11

      - name: Install Rust tooling
        uses: taiki-e/install-action@1ed6d7be6168f6c9046541087ff549b6bc581fdf # v2
        with:
          tool: cargo-ndk,just,cargo-deny@0.20.2

      - name: Configure SCCache & AWS-LC-RS
        run: |
          echo "SCCACHE_GHA_ENABLED=true" >> "$GITHUB_ENV"
          echo "RUSTC_WRAPPER=sccache" >> "$GITHUB_ENV"
          echo "AWS_LC_SYS_PREBUILT_NASM=1" >> "$GITHUB_ENV"

      - name: Cache Gradle dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties', '**/libs.versions.toml') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Cache Cargo dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-${{ hashFiles('uniffi/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Audit Rust dependency policy
        run: cargo deny --config uniffi/deny.toml --manifest-path uniffi/Cargo.toml check advisories licenses sources

      - name: Configure Android SDK
        run: |
          if [ -z "${ANDROID_HOME:-}" ]; then
            echo "ANDROID_HOME is not set on runner."
            exit 1
          fi
          sdkmanager_path="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$sdkmanager_path" ]; then
            sdkmanager_path="$(find "${ANDROID_HOME}/cmdline-tools" -path '*/bin/sdkmanager' -type f -print -quit)"
          fi
          if [ -z "$sdkmanager_path" ] || [ ! -x "$sdkmanager_path" ]; then
            echo "sdkmanager was not found under ANDROID_HOME=${ANDROID_HOME}."
            exit 1
          fi
          install_android_packages() {
            local attempt=1
            local max_attempts=3
            local delay

            while (( attempt <= max_attempts )); do
              echo "::group::Install Android SDK packages (attempt ${attempt}/${max_attempts})"
              if "$sdkmanager_path" \
                "platforms;android-${ANDROID_PLATFORM_VERSION}" \
                "build-tools;${ANDROID_BUILD_TOOLS_VERSION}" \
                "ndk;${ANDROID_NDK_VERSION}" \
                "platform-tools" \
                "emulator" \
                "system-images;android-${ANDROID_PLATFORM_VERSION};google_apis;x86_64"; then
                echo "::endgroup::"
                return 0
              fi
              echo "::endgroup::"

              if (( attempt == max_attempts )); then
                echo "::error::Android SDK package installation failed after ${max_attempts} attempts."
                return 1
              fi

              delay=$((attempt * 15))
              echo "::warning::Android SDK package download failed; retrying in ${delay}s."
              sleep "$delay"
              attempt=$((attempt + 1))
            done
          }

          install_android_packages
          echo "ANDROID_NDK_HOME=${ANDROID_HOME}/ndk/${ANDROID_NDK_VERSION}" >> "$GITHUB_ENV"
          echo "sdk.dir=${ANDROID_HOME}" > local.properties

      - name: Check Rust formatting
        run: cargo fmt --manifest-path uniffi/Cargo.toml --all -- --check

      - name: Run Rust Clippy
        run: cargo clippy --manifest-path uniffi/Cargo.toml --workspace --all-targets --locked -- -D warnings

      - name: Run Rust tests
        run: cargo test --manifest-path uniffi/Cargo.toml --workspace --locked

      - name: Check Rust bindings
        run: just check-bindings

      - name: Run Android quality checks
        run: ./gradlew ktlintCheck testDebugUnitTest lintDebug

      - name: Build Debug APK
        run: ./gradlew app:assembleDebug

      - name: Check Android emulator acceleration
        run: |
          set -euo pipefail
          EMULATOR="${ANDROID_HOME}/emulator/emulator"
          if [ ! -x "$EMULATOR" ]; then
            echo "Android emulator was not found: $EMULATOR" >&2
            exit 1
          fi
          if [ ! -e /dev/kvm ]; then
            echo "KVM device /dev/kvm is unavailable on this runner." >&2
            exit 1
          fi
          sudo chown "$(id -un)" /dev/kvm
          sudo chmod 0600 /dev/kvm
          "$EMULATOR" -accel-check

      - name: Start Android API 36 emulator
        run: |
          set -euo pipefail
          EMULATOR_LOG="${RUNNER_TEMP}/chimera-emulator.log"
          trap 'status=$?; echo "::error::Android emulator startup failed (exit ${status}) at: ${BASH_COMMAND}"; if [ -f "$EMULATOR_LOG" ]; then tail -n 80 "$EMULATOR_LOG"; fi; exit "$status"' ERR
          AVDMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/avdmanager"
          if [ ! -x "$AVDMANAGER" ]; then
            AVDMANAGER="$(find "${ANDROID_HOME}/cmdline-tools" -path '*/bin/avdmanager' -type f -print -quit)"
          fi
          EMULATOR="${ANDROID_HOME}/emulator/emulator"
          ADB="${ANDROID_HOME}/platform-tools/adb"
          AVD_PACKAGE="system-images;android-${ANDROID_PLATFORM_VERSION};google_apis;x86_64"
          AVD_HOME="${RUNNER_TEMP}/android-avd"
          if [ -z "$AVDMANAGER" ] || [ ! -x "$AVDMANAGER" ]; then
            echo "avdmanager was not found under ANDROID_HOME=${ANDROID_HOME}." >&2
            exit 1
          fi
          if [ ! -x "$EMULATOR" ]; then
            echo "Android emulator was not found: $EMULATOR" >&2
            exit 1
          fi
          if [ ! -x "$ADB" ]; then
            echo "Android platform-tools adb was not found: $ADB" >&2
            exit 1
          fi
          if ! command -v timeout >/dev/null 2>&1; then
            echo "timeout was not found on PATH." >&2
            exit 1
          fi

          mkdir -p "$AVD_HOME"
          export ANDROID_AVD_HOME="$AVD_HOME"
          echo "no" | "$AVDMANAGER" create avd \
            --force \
            --name chimera-ci \
            --package "$AVD_PACKAGE" \
            --path "$AVD_HOME/chimera-ci.avd" \
            --device pixel_2
          if ! "$EMULATOR" -list-avds | grep -Fxq chimera-ci; then
            echo "Created AVD chimera-ci is not visible to the Android emulator." >&2
            exit 1
          fi
          "$EMULATOR" -avd chimera-ci \
            -no-window -no-audio -no-boot-anim -no-snapshot \
            -gpu swiftshader_indirect -no-metrics \
            > "$EMULATOR_LOG" 2>&1 &
          echo "$!" > "$RUNNER_TEMP/chimera-emulator.pid"

          timeout 120 "$ADB" wait-for-device
          timeout 300 bash -c '
            ADB="${ANDROID_HOME}/platform-tools/adb"
            until [ "$("$ADB" shell getprop sys.boot_completed 2>/dev/null | tr -d "\r")" = "1" ]; do
              sleep 5
            done
          '
          "$ADB" shell settings put global window_animation_scale 0
          "$ADB" shell settings put global transition_animation_scale 0
          "$ADB" shell settings put global animator_duration_scale 0
          # Headless Android UI tests need the application window to keep focus.
          "$ADB" shell svc power stayon true
          "$ADB" shell input keyevent KEYCODE_WAKEUP

      - name: Run Android instrumentation tests
        run: ./gradlew connectedDebugAndroidTest

      - name: Stop Android emulator
        if: always()
        run: |
          ADB="${ANDROID_HOME}/platform-tools/adb"
          if [ -x "$ADB" ]; then
            "$ADB" emu kill || true
          fi

      - name: Upload CI reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ci-reports-${{ github.run_id }}
          path: |
            app/build/reports/tests/testDebugUnitTest/**
            app/build/test-results/testDebugUnitTest/**
            app/build/reports/androidTests/connected/**
            app/build/outputs/androidTest-results/connected/**
            app/build/reports/lint-results-debug.*
            core/build/reports/lint-results-debug.*
            ${{ runner.temp }}/chimera-emulator.log
          if-no-files-found: warn
          retention-days: 14

      - name: Upload Debug APK artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: app-debug-apks-${{ github.run_id }}
          path: |
            app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
