name: CI Build

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

defaults:
  run:
    shell: bash

env:
  RUST_TOOLCHAIN: "stable"
  RUSTC_BOOTSTRAP: "1"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r29

      - name: Setup sccache
        uses: mozilla-actions/sccache-action@v0.0.10

      - name: Install cargo-ndk and just
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-ndk,just

      - name: Configure SCCache & AWS-LC-RS
        run: |
          echo "SCCACHE_GHA_ENABLED=true" >> $GITHUB_ENV
          echo "RUSTC_WRAPPER=sccache" >> $GITHUB_ENV
          echo "AWS_LC_SYS_PREBUILT_NASM=1" >> $GITHUB_ENV

      - name: Ensure Android SDK path
        run: |
          if [ ! -f local.properties ]; then
            if [ -z "${ANDROID_HOME:-}" ]; then
              echo "ANDROID_HOME is not set on runner."
              exit 1
            fi
            echo "sdk.dir=${ANDROID_HOME}" > local.properties
          fi

      - name: Run quality checks
        run: ./gradlew testDebugUnitTest lintDebug

      - name: Build Debug APK
        run: ./gradlew assembleDebug

      - name: Upload Debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apks-${{ github.run_id }}
          path: |
            app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
